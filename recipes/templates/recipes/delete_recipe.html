{% extends "base.html" %}
{% block body_class %}page-background{% endblock %}
{% block title %}Delete Recipe - TasteHub{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0 rounded-4">

                <div class="card-body p-4 p-md-5">

                    <h1 class="fw-bold mb-3">
                        Delete Recipe
                    </h1>

                    <p class="text-muted mb-4">
                        Are you sure you want to delete the recipe "<strong>{{ recipe.name }}</strong>"?
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                        <a href="{% url 'recipe_detail' recipe.id %}" class="btn btn-primary">Cancel</a>
                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
